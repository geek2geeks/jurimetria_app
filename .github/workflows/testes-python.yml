name: Testes Python

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  testes:
    runs-on: [self-hosted, Windows, X64, jurimetria_app]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create isolated virtual environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "jurimetria-venv"
          if (Test-Path $venv) {
            Remove-Item -Recurse -Force $venv
          }
          python -m venv $venv

      - name: Install dependencies
        run: |
          & "$env:RUNNER_TEMP\jurimetria-venv\Scripts\python.exe" -m pip install --upgrade pip
          & "$env:RUNNER_TEMP\jurimetria-venv\Scripts\python.exe" -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: |
          & "$env:RUNNER_TEMP\jurimetria-venv\Scripts\python.exe" -m pip check

      - name: Verify required imports
        run: |
          & "$env:RUNNER_TEMP\jurimetria-venv\Scripts\python.exe" -c "import numpy, sklearn, torch, pdfplumber, requests, dotenv, tqdm"

      - name: Run unit tests
        run: |
          & "$env:RUNNER_TEMP\jurimetria-venv\Scripts\python.exe" -m unittest discover -s tests -p "test_*.py" -v
